<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Praxis</title>
<link rel="icon" href="data:,">
<style>
:root {
  --win-bg:      #F3F5F2;
  --win-face:    #F7F9F8;
  --win-bdr-dk:  #B9C2BD;
  --win-bdr-lt:  #FFFFFF;
  --win-bdr-mid: #CFD7D2;
  --header:      #163B3B;
  --accent:      #145D65;
  --accent-dk:   #0E4B51;
  --txt:         #1F2A27;
  --txt-muted:   #52615D;
  --input-bg:    #FFFFFF;
  --log-bg:      #101A1A;
  --log-ok:      #1A7F5A;
  --log-info:    #1F6FB5;
  --log-warn:    #B77A2C;
  --log-err:     #B8403C;
  --font:        'Segoe UI', Tahoma, Arial, sans-serif;
  --fs:          12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font); font-size: var(--fs);
  background: var(--win-bg); color: var(--txt);
  height: 100vh; display: flex; flex-direction: column;
  overflow: hidden; user-select: none;
}

/* ══ APP ══════════════════════════════════════════════════════ */
#app { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
#app.hidden { display: none; }

/* Header */
#hdr {
  background: var(--header); color: #fff; height: 36px;
  display: flex; align-items: center; gap: 8px; padding: 0 12px;
  flex-shrink: 0; border-bottom: 2px solid #001533;
}
.hdr-logo {
  width: 22px; height: 22px; background: #fff; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: bold; font-size: 9px; color: var(--header);
}
.hdr-title  { font-size: 12px; font-weight: bold; }
.hdr-sep    { width: 1px; height: 16px; background: rgba(255,255,255,.3); margin: 0 4px; }
.hdr-spacer { flex: 1; }
.hdr-user   { font-size: 10px; color: #7AADCC; }

/* Toolbar */
#toolbar {
  background: var(--win-bg); border-bottom: 1px solid var(--win-bdr-mid);
  padding: 3px 8px; display: flex; align-items: center; gap: 4px; flex-shrink: 0;
}
.tb-sep { width: 1px; height: 20px; background: var(--win-bdr-mid); margin: 0 3px; }
.tb-btn {
  display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px;
  background: var(--win-bg); border: 1px solid var(--win-bdr-mid);
  border-right-color: var(--win-bdr-dk); border-bottom-color: var(--win-bdr-dk);
  font-family: var(--font); font-size: 11px; cursor: pointer; color: var(--txt);
  border-radius: 2px; min-width: 68px; justify-content: center; height: 24px;
}
.tb-btn:hover:not(:disabled)  { background: #E0EDF8; border-color: var(--accent); }
.tb-btn:active:not(:disabled) {
  border-color: var(--win-bdr-dk); border-right-color: var(--win-bdr-lt);
  border-bottom-color: var(--win-bdr-lt); background: #C4C0B8;
}
.tb-btn:disabled { color: var(--win-bdr-mid); cursor: default; }
.tb-btn.run  { background: var(--accent); color: #fff; border-color: var(--accent-dk); font-weight: bold; }
.tb-btn.run:hover:not(:disabled) { background: var(--accent-dk); }
.tb-btn.stop { color: #AA0000; }

/* Main */
#main { display: flex; flex: 1; overflow: hidden; }

/* Sidebar */
#sidebar {
  width: 185px; min-width: 140px; background: var(--win-face);
  border-right: 1px solid var(--win-bdr-mid);
  display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0;
}
.sb-hdr { background: var(--header); color: #fff; padding: 7px 10px; font-size: 11px; font-weight: 600; flex-shrink: 0; letter-spacing: .04em; }
#script-list { flex: 1; overflow-y: auto; }
.cat-lbl {
  background: #E9EFED; padding: 5px 10px; font-size: 10px; font-weight: 700;
  color: var(--txt-muted); text-transform: uppercase; letter-spacing: .08em;
  border-bottom: 1px solid var(--win-bdr-mid);
}
.s-item {
  padding: 9px 10px; border-bottom: 1px solid #E3E9E7; cursor: pointer; font-size: 11px;
  display: flex; align-items: center; gap: 6px; color: var(--txt);
}
.s-item:hover  { background: #EEF5F5; color: var(--header); }
.s-item.active { background: var(--accent); color: #fff; }

/* Content */
#content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

#form-area {
  flex: 1; background: #fff; overflow-y: auto; padding: 14px 16px;
  border-bottom: 1px solid var(--win-bdr-mid);
}
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #BBB; gap: 8px; }
.empty-icon { font-size: 36px; opacity: .4; }
.empty-msg  { font-size: 11px; }

.form-hdr { border-bottom: 2px solid var(--accent); padding-bottom: 6px; margin-bottom: 14px; }
.form-title { font-size: 13px; font-weight: bold; color: var(--accent); }
.form-desc  { font-size: 10px; color: var(--txt-muted); margin-top: 2px; }

.form-grid { display: grid; grid-template-columns: 150px 1fr; gap: 8px 10px; align-items: start; max-width: 520px; }

.form-label { font-size: 11px; text-align: right; color: #333; padding-top: 3px; }
.form-label.req::after { content: " *"; color: #CC0000; font-weight: bold; }

.form-field { display: flex; flex-direction: column; gap: 2px; }

.form-input,
.form-select {
  height: 24px; padding: 1px 6px; border: 1px solid #BCC9C4;
  font-family: var(--font); font-size: 11px; background: var(--input-bg);
  width: 100%; outline: none; color: var(--txt); border-radius: 4px;
}
.form-input:focus, .form-select:focus { border-color: var(--accent); background: #F2F8F8; box-shadow: inset 0 0 0 1px rgba(20,93,101,.12); }
.form-select { cursor: pointer; }
.form-hint { font-size: 9px; color: var(--txt-muted); }
.form-check-wrap { display: inline-flex; align-items: center; gap: 8px; min-height: 24px; color: var(--txt); }
.form-check { width: 15px; height: 15px; accent-color: var(--accent); }

/* Separador de seção opcional */
.form-section-sep {
  grid-column: 1 / -1;
  border: none; border-top: 1px dashed #CCC;
  margin: 4px 0;
}

/* Progress */
#progress { display: none; padding: 6px 14px; background: var(--win-face); border-top: 1px solid var(--win-bdr-mid); flex-direction: column; gap: 5px; flex-shrink: 0; }
#progress.on { display: flex; }
.prog-lbl { font-size: 10px; color: #333; }
.prog-track { height: 14px; background: var(--win-bg); border: 1px solid var(--win-bdr-dk); border-right-color: var(--win-bdr-lt); border-bottom-color: var(--win-bdr-lt); overflow: hidden; }
#prog-fill { height: 100%; width: 0%; background: repeating-linear-gradient(90deg,#003B8C 0,#003B8C 9px,#0066CC 9px,#0066CC 18px); transition: width .3s ease; }

/* Log */
#log { height: 96px; background: var(--log-bg); overflow-y: auto; padding: 5px 8px; font-family: 'Courier New', monospace; font-size: 10px; flex-shrink: 0; border-top: 2px solid #000; user-select: text; white-space: pre-wrap; }
.ll { margin-bottom: 1px; line-height: 1.4; }
.lt { color: #4A5568; margin-right: 5px; }
.lk { color: var(--log-ok); }
.li { color: var(--log-info); }
.lw { color: var(--log-warn); }
.le { color: var(--log-err); }
.lred { color: #CC0000; }
.laviso { color: #D29922; }

/* Status bar */
#sbar { background: var(--win-bg); border-top: 1px solid var(--win-bdr-dk); padding: 2px 8px; display: flex; align-items: center; gap: 12px; font-size: 10px; color: #333; flex-shrink: 0; }
.s-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 3px; }
.s-dot.ok  { background: #2E7D32; }
.s-dot.run { background: #E65100; animation: blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
.s-sep { width: 1px; height: 10px; background: var(--win-bdr-mid); }

::-webkit-scrollbar { width: 13px; }
::-webkit-scrollbar-track { background: var(--win-bg); border: 1px solid var(--win-bdr-mid); }
::-webkit-scrollbar-thumb { background: #A8A4A0; border: 1px outset #EEE; }
::-webkit-scrollbar-thumb:hover { background: #888; }
</style>
</head>
<body>

<!-- APP -->
<div id="app">
  <div id="hdr">
    <div class="hdr-logo">MV</div>
    <span class="hdr-title">Praxis</span>
    <div class="hdr-sep"></div>
    <span style="font-size:10px;color:#7AADCC;">Automação Hospitalar</span>
    <div class="hdr-spacer"></div>
    <span class="hdr-user" id="hdr-user"></span>
  </div>

  <div id="toolbar">
    <button class="tb-btn run"  id="btn-run"  onclick="runScript()"  disabled>Executar</button>
    <button class="tb-btn stop" id="btn-stop" onclick="stopScript()" disabled>Parar</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" onclick="clearLog()">Limpar Log</button>
    <button class="tb-btn" onclick="clearForm()">Limpar</button>
  </div>

  <div id="main">
    <div id="sidebar">
      <div class="sb-hdr">Módulos Praxis</div>
      <div id="script-list"></div>
    </div>
    <div id="content">
      <div id="form-area">
        <div class="empty" id="empty-state">
          <div class="empty-icon">📋</div>
          <div class="empty-msg">Selecione um módulo na lista lateral</div>
        </div>
        <div id="script-form" style="display:none">
          <div class="form-hdr">
            <div class="form-title" id="form-title"></div>
            <div class="form-desc"  id="form-desc"></div>
          </div>
          <div class="form-grid" id="form-grid"></div>
        </div>
      </div>
      <div id="progress">
        <div class="prog-lbl" id="prog-lbl">Processando...</div>
        <div class="prog-track"><div id="prog-fill"></div></div>
      </div>
      <div id="log"></div>
    </div>
  </div>

  <div id="sbar">
    <span><span class="s-dot ok" id="s-dot"></span><span id="s-txt">Pronto</span></span>
    <div class="s-sep"></div>
    <span id="s-script">Nenhum módulo selecionado</span>
    <div class="s-sep"></div>
    <span>v1.0.0</span>
  </div>
</div>

<script>
let scripts = [], current = null, running = false;

const ahk = {
  send(data) {
    if (window.chrome?.webview) window.chrome.webview.postMessage(JSON.stringify(data));
    else {
      console.log('[→ AHK]', data);
      devSim(data);
    }
  },
  receive(data) {
    switch (data.type) {
      case 'app_ready':  onAppReady(data);                     break;
      case 'status':     onStatus(data.message, data.running); break;
      case 'log':        appendLog(data.message, 'i');         break;
      case 'progress':   setProgress(data.value);              break;
      case 'done':       onDone(data.message);                 break;
      case 'error':      onError(data.message);                break;
    }
  }
};

function parseWebViewMessage(data) {
  return typeof data === 'string' ? JSON.parse(data) : data;
}

if (window.chrome?.webview)
  window.chrome.webview.addEventListener('message', e => ahk.receive(parseWebViewMessage(e.data)));

document.addEventListener('DOMContentLoaded', () => ahk.send({ action: 'ready' }));

// ─── App bootstrap ────────────────────────────────────────────
function onAppReady(data) {
  scripts = data.scripts || [];
  renderSidebar();
  document.getElementById('hdr-user').textContent = '';
  appendLog('Pronto. Selecione um módulo para iniciar.', 'k');
}

// ─── Sidebar ──────────────────────────────────────────────────
const CAT_ICONS = { 'Faturamento':'💰', 'Movimentação':'🏥', 'Relatórios':'📊' };

function renderSidebar() {
  const cats = {};
  scripts.forEach(s => (cats[s.categoria] = cats[s.categoria] || []).push(s));
  let html = '';
  for (const [cat, items] of Object.entries(cats)) {
    html += `<div class="cat-lbl">${CAT_ICONS[cat]??'📁'} ${cat}</div>`;
    items.forEach(s => {
      html += `<div class="s-item" id="item-${s.id}" onclick="selectScript('${s.id}')">
                 <span>📄</span><span>${s.nome}</span></div>`;
    });
  }
  document.getElementById('script-list').innerHTML = html;
}

function selectScript(id) {
  if (running) return;
  current = scripts.find(s => s.id === id);
  if (!current) return;
  document.querySelectorAll('.s-item').forEach(el => el.classList.remove('active'));
  document.getElementById(`item-${id}`)?.classList.add('active');
  renderForm(current);
  document.getElementById('s-script').textContent = current.nome;
  document.getElementById('btn-run').disabled = false;
}

// ─── Form ─────────────────────────────────────────────────────
function renderForm(script) {
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('script-form').style.display = 'block';
  document.getElementById('form-title').textContent = script.nome;
  document.getElementById('form-desc').textContent  = script.descricao;

  // Separa campos obrigatórios dos opcionais
  const required = script.params.filter(p => p.obrigatorio);
  const optional = script.params.filter(p => !p.obrigatorio);

  let html = '';
  required.forEach(p => { html += renderField(p); });

  if (optional.length > 0) {
    html += `<hr class="form-section-sep"><label class="form-label" style="color:var(--txt-muted);font-size:10px;">Opcional</label><div></div>`;
    optional.forEach(p => { html += renderField(p); });
  }

  document.getElementById('form-grid').innerHTML = html;
}

function renderField(p) {
  const req  = p.obrigatorio;
  const hint = p.hint ?? '';
  let input  = '';

  if (p.tipo === 'select') {
    const opts = p.opcoes.map(o =>
      `<option value="${o}"${o === p.default ? ' selected' : ''}>${o}</option>`).join('');
    input = `<select class="form-select" id="p-${p.id}"${req?' required':''}>
               <option value="">-- Selecione --</option>${opts}</select>`;
  } else if (p.tipo === 'checkbox') {
    const checked = p.default !== false;
    input = `<label class="form-check-wrap">
              <input class="form-check" type="checkbox" id="p-${p.id}" ${checked ? 'checked' : ''}>
              <span>${esc(hint || 'Ativar')}</span>
             </label>`;
  } else {
    input = `<input class="form-input" type="${p.tipo}" id="p-${p.id}"
             ${req?'required':''} ${hint?`placeholder="${esc(hint)}"`:''}>`;
  }

  return `
    <label class="form-label${req?' req':''}" for="p-${p.id}">${esc(p.label)}</label>
    <div class="form-field">
      ${input}
      ${hint && p.tipo !== 'select' && p.tipo !== 'checkbox' ? `<span class="form-hint">${esc(hint)}</span>` : ''}
    </div>`;
}

function clearForm() {
  if (!current) return;
  current.params.forEach(p => {
    const el = document.getElementById(`p-${p.id}`);
    if (!el) return;
    if (p.tipo === 'checkbox') el.checked = p.default !== false;
    else el.value = '';
  });
}

function collectParams() {
  const params = {};
  for (const p of current.params) {
    const el  = document.getElementById(`p-${p.id}`);
    if (p.tipo === 'checkbox') {
      params[p.id] = !!el?.checked;
      continue;
    }
    const val = el?.value?.trim() ?? '';
    if (p.obrigatorio && !val) {
      appendLog(`Campo obrigatório não preenchido: ${p.label}`, 'w');
      el?.focus();
      return null;
    }
    params[p.id] = val;
  }
  return params;
}

// ─── Run / Stop ───────────────────────────────────────────────
function runScript() {
  if (!current || running) return;
  const params = collectParams();
  if (!params) return;
  setRunning(true);
  showProgress();
  appendLog(`Iniciando: ${current.nome}`, 'i');
  ahk.send({ action: 'run_script', scriptId: current.id, params });
}

function stopScript() { ahk.send({ action: 'stop_script' }); }

function onStatus(msg, isRunning) {
  document.getElementById('s-txt').textContent = msg;
  setRunning(isRunning ?? false);
  appendLog(msg, 'i');
}

function onDone(msg) {
  appendLog(msg, 'k');
  setRunning(false);
  setProgress(100);
  document.getElementById('prog-lbl').textContent = 'Concluído!';
  setTimeout(hideProgress, 2500);
}

function onError(msg) { appendLog('ERRO: ' + msg, 'e'); setRunning(false); hideProgress(); }

function setRunning(val) {
  running = val;
  document.getElementById('btn-run').disabled  = val;
  document.getElementById('btn-stop').disabled = !val;
  document.getElementById('s-dot').className   = `s-dot ${val?'run':'ok'}`;
}

function showProgress()  { setProgress(0); document.getElementById('progress').classList.add('on'); document.getElementById('prog-lbl').textContent='Processando...'; }
function hideProgress()  { document.getElementById('progress').classList.remove('on'); }
function setProgress(p)  {
  p = Math.max(0, Math.min(100, Math.round(Number(p) || 0)));
  document.getElementById('prog-fill').style.width=p+'%';
  if(p>0&&p<100) document.getElementById('prog-lbl').textContent=`Processando... ${p}%`;
}

function appendLog(msg, type) {
  const area = document.getElementById('log');
  const now  = new Date().toLocaleTimeString('pt-BR');
  const el   = document.createElement('div');
  el.className = 'll';
  let safe = esc(msg)
    .replace(/\r\n|\r|\n/g, '<br>');
  safe = safe.replace(/\[\[red\]\]([\s\S]*?)\[\[\/red\]\]/g, '<span class="lred">$1</span>');
  safe = safe.replace(/\[\[aviso\]\]([\s\S]*?)\[\[\/aviso\]\]/g, '<span class="laviso">$1</span>');
  el.innerHTML = `<span class="lt">[${now}]</span><span class="l${type}">${safe}</span>`;
  area.appendChild(el);
  area.scrollTop = area.scrollHeight;
}

function clearLog() { document.getElementById('log').innerHTML = ''; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ─── Dev sim ──────────────────────────────────────────────────
function devSim(data) {
  if (data.action !== 'ready') return;

  setTimeout(() => ahk.receive({
    type: 'app_ready',
    scripts: [
      { id:'remessa_protocolo', nome:'Remessa por Protocolo', categoria:'Faturamento',
        descricao:'Baixa protocolos no MOV DOC e cria/atualiza remessa no FFCV',
        params:[
          { id:'protocolos',     label:'Protocolos',           tipo:'text',  obrigatorio:true,  hint:'Ex: 12345, 67890' },
          { id:'tipo_conta',     label:'Tipo de Conta',        tipo:'select',obrigatorio:true,
            opcoes:['Internamento','Ambulatório','Emergência'] },
          { id:'num_remessa',    label:'Remessa Existente',    tipo:'text',  obrigatorio:false, hint:'Deixe vazio para criar nova' },
          { id:'imprimir_relatorio', label:'Imprimir relatório ao encerrar', tipo:'checkbox', obrigatorio:false, default:true }
        ]
      }
    ]
  }), 200);
}
</script>
</body>
</html>
